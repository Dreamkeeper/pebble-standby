<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standby</title>
  <meta name="htmx-config" content='{"allowEval": false}'>
  <script src="/ui/static/htmx.min.js"></script>
  <script src="/ui/static/dashboard.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0 16px 48px;
           max-width: 1000px; margin-inline: auto; }
    nav { display: flex; gap: 16px; align-items: center; padding: 12px 0;
          border-bottom: 1px solid #8884; margin-bottom: 16px; flex-wrap: wrap; }
    nav .brand { font-weight: 700; }
    nav .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
    a { color: inherit; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #8883; }
    .state { display: inline-block; margin: 2px 0; font-weight: 650;
             padding: 3px 8px; border-radius: 6px; }
    .st-alarm { background: #b00020; color: white; }
    .st-silent, .st-late, .st-degraded { background: #ffdea6; color: #271900; }
    .st-offline, .st-suspended, .st-test { background: #d5e3ff; color: #001b3c; }
    .st-ok { background: #086641; color: white; }
    .st-disabled { background: #e4e5e7; color: #333538; }
    @media (prefers-color-scheme: dark) {
      .st-offline, .st-suspended, .st-test { background: #264777; color: #d5e3ff; }
      .st-ok { background: #145a3e; color: #e2ffec; }
      .st-disabled { background: #37393c; color: #eee; }
    }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 12px 16px;
            margin: 12px 0; }
    .danger { color: #b00020; font-weight: 700; }
    button { padding: 6px 12px; cursor: pointer; }
    input, select { padding: 6px 8px; margin: 2px 0; }
    form.inline { display: inline; }
    .muted { opacity: .7; font-size: .9em; }
    .bar { display: inline-block; width: 4px; background: #2e7d32;
           vertical-align: bottom; margin-right: 1px; }
  </style>
</head>
<body {% if op %}hx-headers='{"X-CSRF": "{{ op.csrf }}"}'{% endif %}>
<nav>
  <span class="brand">◉ Standby</span>
  {% if op %}
    <a href="/ui/">Fleet</a>
    {% if op.role == 'admin' %}
      <a href="/ui/operators">Operators</a>
      <a href="/ui/audit">Audit</a>
    {% endif %}
    <span class="right">
      <span class="muted">{{ op.username }} ({{ op.role }})</span>
      <form class="inline" method="post" action="/ui/logout">
        <input type="hidden" name="csrf" value="{{ op.csrf }}">
        <button>Log out</button>
      </form>
    </span>
  {% endif %}
</nav>
{% block content %}{% endblock %}
</body>
</html>
