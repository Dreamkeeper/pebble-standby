<table>
  <tr><th>Wearer</th><th>State</th><th>Last phone report</th><th>Battery</th>
      <th>Active alerts</th></tr>
  {% for w in fleet %}
  <tr>
    <td><a href="/ui/wearers/{{ w.id }}">{{ w.name }}</a>
        <span class="muted">({{ w.id }})</span></td>
    <td>
      {% for s in w.states %}
        <span class="state st-{{ s.css }}">{{ s.label }}</span>
      {% endfor %}
    </td>
    <td>{{ w.last_hb }}</td>
    <td>{{ w.battery if w.battery is not none else "—" }}</td>
    <td>{{ w.escalations }}</td>
  </tr>
  {% endfor %}
</table>
<p class="muted">Updated {{ now }}</p>
