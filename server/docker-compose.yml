# Self-hosted deployment: VPS, NAS or home server.
#   cp .env.example .env   # set CM_API_TOKEN, Telegram bot token, SMTP creds
#   docker compose up -d
services:
  monitor:
    build: .
    restart: unless-stopped
    # Runs as UID 10001 (see the Dockerfile): the data directory must be
    # owned by that UID on the host, see docs/DEPLOY-SYNOLOGY.md step 1.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # Loopback only: the reverse proxy (DSM, Caddy, nginx) is the one way in.
    # A bare "8080:8080" publishes the plaintext API to every network the
    # host is on, and Docker's own rules bypass the host firewall
    # (security hunt 2026-10-26).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Legacy single-wearer token: migrated into wearer 'default' on
      # first boot with an empty database, inert afterwards.
      CM_API_TOKEN: ${CM_API_TOKEN:-}
      # Admin credential for wearer/enrollment/contact administration.
      CM_ADMIN_TOKEN: ${CM_ADMIN_TOKEN:-}
      # Public base URL, used to build acknowledge links in messages.
      CM_PUBLIC_URL: ${CM_PUBLIC_URL:-}
      CM_TELEGRAM_BOT_TOKEN: ${CM_TELEGRAM_BOT_TOKEN:-}
      CM_SMTP_HOST: ${CM_SMTP_HOST:-}
      CM_SMTP_PORT: ${CM_SMTP_PORT:-587}
      CM_SMTP_USER: ${CM_SMTP_USER:-}
      CM_SMTP_PASSWORD: ${CM_SMTP_PASSWORD:-}
      CM_SMTP_FROM: ${CM_SMTP_FROM:-}
      CM_NTFY_URL: ${CM_NTFY_URL:-https://ntfy.sh}
      CM_ENROLL_TTL_S: ${CM_ENROLL_TTL_S:-86400}
      CM_DIAG_MAX_BYTES: ${CM_DIAG_MAX_BYTES:-20971520}
      CM_DIAG_RETENTION_DAYS: ${CM_DIAG_RETENTION_DAYS:-30}
      CM_DIAG_MAX_BUNDLES_PER_WEARER: ${CM_DIAG_MAX_BUNDLES_PER_WEARER:-20}
      # Optional outbound HTTP(S) proxy for Telegram/ntfy.sh API calls —
      # needed where api.telegram.org is blocked (set e.g.
      # CM_OUTBOUND_PROXY=http://xray-client:1083). urllib honors these.
      HTTPS_PROXY: ${CM_OUTBOUND_PROXY:-}
      HTTP_PROXY: ${CM_OUTBOUND_PROXY:-}
      NO_PROXY: ${CM_NO_PROXY:-ntfy,localhost,127.0.0.1}
      # Web dashboard: first-boot admin bootstrap (remove after first
      # login) and UI behavior knobs.
      CM_UI_ADMIN_USER: ${CM_UI_ADMIN_USER:-}
      CM_UI_ADMIN_PASSWORD: ${CM_UI_ADMIN_PASSWORD:-}
      CM_SESSION_TTL_S: ${CM_SESSION_TTL_S:-604800}
      CM_UI_REFRESH_S: ${CM_UI_REFRESH_S:-15}
      CM_UI_INSECURE_COOKIES: ${CM_UI_INSECURE_COOKIES:-}
      # Debug mode: set to DEBUG in .env for extensive logs
      CM_LOG_LEVEL: ${CM_LOG_LEVEL:-INFO}
      # Reverse proxy in front (Caddy, DSM, nginx)? Name its address here
      # so uvicorn trusts its X-Forwarded-For — otherwise every caller
      # shares the proxy's address and ONE rate-limit bucket (login,
      # enrollment), and the audit trail records the proxy. Only trust
      # a proxy that is the sole way to reach port 8080.
      FORWARDED_ALLOW_IPS: ${CM_FORWARDED_ALLOW_IPS:-127.0.0.1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    # If the proxy runs in another compose project, attach its network:
    #   networks: [default, proxynet]
    # and declare at top level:
    #   networks: { proxynet: { external: true, name: <proxy-net-name> } }
    volumes:
      - ./data:/srv/data

  # Optional self-hosted push server (contacts subscribe to their topic)
  ntfy:
    # v2.28.0 (2026-08-27), digest from Docker Hub on 2026-10-13; the two
    # newer releases were under seven days old at that date.
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    command: serve
    restart: unless-stopped
    # ntfy has no authentication configured: anyone who reaches this port
    # can read and publish every topic. Loopback only; expose it to
    # contacts through the TLS reverse proxy, never directly.
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
